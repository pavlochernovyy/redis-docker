name: Test project (manual)

# Runs bootstrap then teardown in the same job, on demand from the Actions
# tab, as an end-to-end smoke test of both flows together. GitHub-hosted
# runners are ephemeral, so nothing persists after the job — this doesn't
# stand up a reachable environment, it just verifies the scripts work.
on:
  workflow_dispatch:

jobs:
  test-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap stack (with pub/sub publisher)
        run: ./scripts/bootstrap.sh

      - name: Verify Redis is reachable
        run: docker exec redis-local redis-cli PING

      - name: Verify pub/sub publisher is running and publishing
        run: |
          ./scripts/pubsub.sh status
          sleep 12
          ./scripts/pubsub.sh logs

      - name: Copy pub/sub log for upload
        if: always()
        run: cp .pubsub.log pubsub.log 2>/dev/null || true

      - name: Upload pub/sub log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubsub-log
          path: pubsub.log
          if-no-files-found: ignore

      - name: Teardown stack
        if: always()
        run: ./scripts/teardown.sh
