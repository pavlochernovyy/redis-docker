name: Teardown (manual)

# Runs the teardown flow on demand from the Actions tab. Since GitHub-hosted
# runners are ephemeral and start clean, there is nothing left over to tear
# down between runs — this only verifies scripts/teardown.sh runs cleanly
# against an empty/uninitialized Terraform state.
on:
  workflow_dispatch:
    inputs:
      volumes:
        description: "Also delete persisted data volumes (--volumes)"
        type: boolean
        default: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Teardown stack
        run: |
          if [[ "${{ inputs.volumes }}" == "true" ]]; then
            ./scripts/teardown.sh --volumes
          else
            ./scripts/teardown.sh
          fi
